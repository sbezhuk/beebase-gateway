# Runs the entire BeeBase stack locally: every service, its own database,
# and this gateway in front of them.
#
# Requires every service repo cloned as a sibling of this one, using its
# GitHub repo name as the directory name:
#   beebase-auth-service/  beebase-apiary-service/  beebase-hive-service/
#   beebase-inspection-service/  beebase-media-service/
#   beebase-statistics-service/  beebase-gateway/ (this repo)
#
# Each service keeps its own standalone docker-compose.yml for solo
# development; this one is only for running the full stack together.

services:
  # --- shared session store ---
  #
  # One Redis instance shared by every backend service below (unlike each
  # service's own postgres, which stays private to it): it's what lets an
  # access token be rejected the instant its session is superseded by a
  # newer one, instead of staying valid until its own JWT expiry.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- auth-service ---

  auth-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_USER/POSTGRES_PASSWORD come from auth-service's own .env -
    # not duplicated here. POSTGRES_DB stays an explicit override: this
    # full-stack compose names the database beebase_auth (matching
    # auth-migrate and auth-service's DATABASE_URL below), while
    # auth-service's own .env uses beebase for its standalone setup -
    # env_file would otherwise silently switch the database name.
    env_file:
      - ../beebase-auth-service/.env
    environment:
      POSTGRES_DB: beebase_auth
    ports:
      - "5432:5432"
    volumes:
      - beebase_auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-migrate:
    image: migrate/migrate:v4.19.0
    # Credentials come from auth-service's own .env via env_file below -
    # never hardcoded here. POSTGRES_HOST/POSTGRES_PORT/POSTGRES_DB are
    # overridden to reach auth-postgres on the compose network under its
    # full-stack database name; DATABASE_URL itself (env_file's own
    # templated value, see beebase-auth-service/.env) then resolves using
    # this container's real, final environment - substitution happens at
    # container start, using the merged env_file + environment: below.
    env_file:
      - ../beebase-auth-service/.env
    environment:
      POSTGRES_HOST: auth-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: beebase_auth
    depends_on:
      auth-postgres:
        condition: service_healthy
    volumes:
      - ../beebase-auth-service/migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - 'migrate -path=/migrations -database "$$DATABASE_URL" up'

  auth-service:
    build:
      context: ../beebase-auth-service
    restart: unless-stopped
    # JWT_PRIVATE_KEY and TOTP_ENCRYPTION_KEY come from auth-service's own
    # .env - not duplicated here - since it's the only service that ever
    # reads them, whether run standalone or (as here) as part of this
    # full-stack compose. See beebase-auth-service/.env.example to
    # provision it (make keygen / openssl rand -base64 32). `environment:`
    # below still wins over this for any key both define.
    env_file:
      - ../beebase-auth-service/.env
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      # DATABASE_URL itself is not set here: it comes from auth-service's
      # own .env (env_file above), which builds it from POSTGRES_USER/
      # POSTGRES_PASSWORD/POSTGRES_HOST/POSTGRES_PORT/POSTGRES_DB - only
      # the host/db need overriding for this network, never the password.
      POSTGRES_HOST: auth-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: beebase_auth
      REDIS_ADDR: redis:6379
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      TOTP_ISSUER: BeeBase
      # Updating a profile's avatar asks media-service to verify
      # ownership of the referenced media id; deleting an account asks it
      # to sweep up every media item belonging to the caller. Neither
      # media-service nor apiary-service is added to depends_on below:
      # each already depends on auth-service (for its own AUTH_JWKS_URL),
      # so the reverse would be a dependency cycle, which Compose
      # disallows. See the matching comment on apiary-service/hive-service
      # below for the same tradeoff.
      MEDIA_SERVICE_URL: http://media-service:8080
      # Deleting an account cascades to every apiary the caller owns (and,
      # transitively, their hives, inspections, and media).
      APIARY_SERVICE_URL: http://apiary-service:8080
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- apiary-service ---

  apiary-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB come from
    # apiary-service's own .env - not duplicated here.
    env_file:
      - ../beebase-apiary-service/.env
    ports:
      - "5433:5432"
    volumes:
      - beebase_apiary_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_apiary"]
      interval: 5s
      timeout: 5s
      retries: 10

  apiary-migrate:
    image: migrate/migrate:v4.19.0
    # Credentials come from apiary-service's own .env via env_file below -
    # never hardcoded here. Only the host/port need overriding for this
    # network; DATABASE_URL (env_file's own templated value, see
    # beebase-apiary-service/.env) resolves using this container's final
    # merged environment at container start.
    env_file:
      - ../beebase-apiary-service/.env
    environment:
      POSTGRES_HOST: apiary-postgres
      POSTGRES_PORT: "5432"
    depends_on:
      apiary-postgres:
        condition: service_healthy
    volumes:
      - ../beebase-apiary-service/migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - 'migrate -path=/migrations -database "$$DATABASE_URL" up'

  apiary-service:
    build:
      context: ../beebase-apiary-service
    restart: unless-stopped
    # Baseline config comes from apiary-service's own .env - not
    # duplicated here. `environment:` below still wins over this for any
    # key both define (the in-network URLs/hosts it must have here
    # instead of the localhost ones apiary-service's own .env uses for
    # standalone dev).
    env_file:
      - ../beebase-apiary-service/.env
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      # DATABASE_URL itself is not set here: it comes from apiary-service's
      # own .env (env_file above), which builds it from POSTGRES_USER/
      # POSTGRES_PASSWORD/POSTGRES_HOST/POSTGRES_PORT/POSTGRES_DB - only
      # the host needs overriding for this network, never the password.
      POSTGRES_HOST: apiary-postgres
      POSTGRES_PORT: "5432"
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      REDIS_ADDR: redis:6379
      # Deleting an apiary cascades to its hives and media. hive-service
      # and media-service are not added to depends_on below: each already
      # depends on apiary-service (for its own ownership verifier), so the
      # reverse would be a dependency cycle, which Compose disallows. A
      # delete request in the first few seconds after a fresh
      # `docker compose up`, before those services are healthy, may
      # transiently fail - acceptable given the abort-on-failure cascade
      # semantics, and no real traffic hits this during that window.
      HIVE_SERVICE_URL: http://hive-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      # Handed to clients as part of each image's image_url, so - unlike
      # every *_SERVICE_URL above - this must stay the gateway's own
      # externally reachable address, not an in-network hostname.
      PUBLIC_BASE_URL: http://localhost:8080
    depends_on:
      apiary-postgres:
        condition: service_healthy
      apiary-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- hive-service ---

  hive-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB come from hive-service's
    # own .env - not duplicated here.
    env_file:
      - ../beebase-hive-service/.env
    ports:
      - "5434:5432"
    volumes:
      - beebase_hive_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_hive"]
      interval: 5s
      timeout: 5s
      retries: 10

  hive-migrate:
    image: migrate/migrate:v4.19.0
    # Credentials come from hive-service's own .env via env_file below -
    # never hardcoded here. Only the host/port need overriding for this
    # network; DATABASE_URL (env_file's own templated value, see
    # beebase-hive-service/.env) resolves using this container's final
    # merged environment at container start.
    env_file:
      - ../beebase-hive-service/.env
    environment:
      POSTGRES_HOST: hive-postgres
      POSTGRES_PORT: "5432"
    depends_on:
      hive-postgres:
        condition: service_healthy
    volumes:
      - ../beebase-hive-service/migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - 'migrate -path=/migrations -database "$$DATABASE_URL" up'

  hive-service:
    build:
      context: ../beebase-hive-service
    restart: unless-stopped
    # Baseline config comes from hive-service's own .env - not duplicated
    # here. `environment:` below still wins over this for any key both
    # define (the in-network URLs/hosts it must have here instead of the
    # localhost ones hive-service's own .env uses for standalone dev).
    env_file:
      - ../beebase-hive-service/.env
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      # DATABASE_URL itself is not set here: it comes from hive-service's
      # own .env (env_file above), which builds it from POSTGRES_USER/
      # POSTGRES_PASSWORD/POSTGRES_HOST/POSTGRES_PORT/POSTGRES_DB - only
      # the host needs overriding for this network, never the password.
      POSTGRES_HOST: hive-postgres
      POSTGRES_PORT: "5432"
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      REDIS_ADDR: redis:6379
      APIARY_SERVICE_URL: http://apiary-service:8080
      # Deleting a hive cascades to its inspections and media.
      # inspection-service and media-service are not added to depends_on
      # below: each already depends on hive-service (for its own
      # ownership verifier), so the reverse would be a dependency cycle,
      # which Compose disallows. See the matching comment on
      # apiary-service above for the runtime tradeoff this implies.
      INSPECTION_SERVICE_URL: http://inspection-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      # Handed to clients as part of each image's image_url, so - unlike
      # every *_SERVICE_URL above - this must stay the gateway's own
      # externally reachable address, not an in-network hostname.
      PUBLIC_BASE_URL: http://localhost:8080
    depends_on:
      hive-postgres:
        condition: service_healthy
      hive-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      apiary-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- inspection-service ---

  inspection-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB come from
    # inspection-service's own .env - not duplicated here.
    env_file:
      - ../beebase-inspection-service/.env
    ports:
      - "5435:5432"
    volumes:
      - beebase_inspection_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_inspection"]
      interval: 5s
      timeout: 5s
      retries: 10

  inspection-migrate:
    image: migrate/migrate:v4.19.0
    # Credentials come from inspection-service's own .env via env_file
    # below - never hardcoded here. Only the host/port need overriding
    # for this network; DATABASE_URL (env_file's own templated value, see
    # beebase-inspection-service/.env) resolves using this container's
    # final merged environment at container start.
    env_file:
      - ../beebase-inspection-service/.env
    environment:
      POSTGRES_HOST: inspection-postgres
      POSTGRES_PORT: "5432"
    depends_on:
      inspection-postgres:
        condition: service_healthy
    volumes:
      - ../beebase-inspection-service/migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - 'migrate -path=/migrations -database "$$DATABASE_URL" up'

  inspection-service:
    build:
      context: ../beebase-inspection-service
    restart: unless-stopped
    # Baseline config comes from inspection-service's own .env - not
    # duplicated here. `environment:` below still wins over this for any
    # key both define (the in-network URLs/hosts it must have here
    # instead of the localhost ones inspection-service's own .env uses
    # for standalone dev).
    env_file:
      - ../beebase-inspection-service/.env
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      # DATABASE_URL itself is not set here: it comes from
      # inspection-service's own .env (env_file above), which builds it
      # from POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_HOST/POSTGRES_PORT/
      # POSTGRES_DB - only the host needs overriding for this network,
      # never the password.
      POSTGRES_HOST: inspection-postgres
      POSTGRES_PORT: "5432"
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      REDIS_ADDR: redis:6379
      HIVE_SERVICE_URL: http://hive-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      # Handed to clients as part of each image's image_url, so - unlike
      # every *_SERVICE_URL above - this must stay the gateway's own
      # externally reachable address, not an in-network hostname.
      PUBLIC_BASE_URL: http://localhost:8080
    depends_on:
      inspection-postgres:
        condition: service_healthy
      inspection-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      hive-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- media-service ---

  media-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB come from
    # media-service's own .env - not duplicated here.
    env_file:
      - ../beebase-media-service/.env
    ports:
      - "5436:5432"
    volumes:
      - beebase_media_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_media"]
      interval: 5s
      timeout: 5s
      retries: 10

  media-migrate:
    image: migrate/migrate:v4.19.0
    # Credentials come from media-service's own .env via env_file below -
    # never hardcoded here. Only the host/port need overriding for this
    # network; DATABASE_URL (env_file's own templated value, see
    # beebase-media-service/.env) resolves using this container's final
    # merged environment at container start.
    env_file:
      - ../beebase-media-service/.env
    environment:
      POSTGRES_HOST: media-postgres
      POSTGRES_PORT: "5432"
    depends_on:
      media-postgres:
        condition: service_healthy
    volumes:
      - ../beebase-media-service/migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - 'migrate -path=/migrations -database "$$DATABASE_URL" up'

  media-service:
    build:
      context: ../beebase-media-service
    restart: unless-stopped
    # STORAGE_BUCKET and STORAGE_REGION come from media-service's own .env
    # - not duplicated here - since it's the only service that ever reads
    # them. Credentials are resolved by the AWS SDK's default chain (e.g.
    # a local `aws configure` profile) - there's no app-level credential
    # config. See beebase-media-service's README Storage section and
    # .env.example. `environment:` below still wins over this for any key
    # both define.
    env_file:
      - ../beebase-media-service/.env
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      # DATABASE_URL itself is not set here: it comes from media-service's
      # own .env (env_file above), which builds it from POSTGRES_USER/
      # POSTGRES_PASSWORD/POSTGRES_HOST/POSTGRES_PORT/POSTGRES_DB - only
      # the host needs overriding for this network, never the password.
      POSTGRES_HOST: media-postgres
      POSTGRES_PORT: "5432"
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      REDIS_ADDR: redis:6379
      # Handed to clients as part of each media item's image_url, so -
      # unlike the AUTH_JWKS_URL above - this must be the gateway's own
      # externally reachable address, not an in-network hostname.
      PUBLIC_BASE_URL: http://localhost:8080
    depends_on:
      media-postgres:
        condition: service_healthy
      media-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- statistics-service ---

  statistics-service:
    build:
      context: ../beebase-statistics-service
    restart: unless-stopped
    # Baseline config comes from statistics-service's own .env - not
    # duplicated here. `environment:` below still wins over this for any
    # key both define (the in-network URLs/hosts it must have here
    # instead of the localhost ones statistics-service's own .env uses
    # for standalone dev).
    env_file:
      - ../beebase-statistics-service/.env
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      REDIS_ADDR: redis:6379
      APIARY_SERVICE_URL: http://apiary-service:8080
      HIVE_SERVICE_URL: http://hive-service:8080
      INSPECTION_SERVICE_URL: http://inspection-service:8080
    depends_on:
      auth-service:
        condition: service_healthy
      apiary-service:
        condition: service_healthy
      hive-service:
        condition: service_healthy
      inspection-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- gateway ---

  gateway:
    build:
      context: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      AUTH_SERVICE_URL: http://auth-service:8080
      APIARY_SERVICE_URL: http://apiary-service:8080
      HIVE_SERVICE_URL: http://hive-service:8080
      INSPECTION_SERVICE_URL: http://inspection-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      STATISTICS_SERVICE_URL: http://statistics-service:8080
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8080
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      apiary-service:
        condition: service_healthy
      hive-service:
        condition: service_healthy
      inspection-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      statistics-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy

  # --- subscription-service ---

  subscription-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../beebase-subscription-service/.env
    environment:
      POSTGRES_DB: beebase_subscription
    ports:
      - "5438:5432"
    volumes:
      - beebase_subscription_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_subscription"]
      interval: 5s
      timeout: 5s
      retries: 10

  subscription-migrate:
    image: migrate/migrate:v4.19.0
    env_file:
      - ../beebase-subscription-service/.env
    environment:
      POSTGRES_HOST: subscription-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: beebase_subscription
    depends_on:
      subscription-postgres:
        condition: service_healthy
    volumes:
      - ../beebase-subscription-service/migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - 'migrate -path=/migrations -database "$$DATABASE_URL" up'

  subscription-service:
    build:
      context: ../beebase-subscription-service
    restart: unless-stopped
    env_file:
      - ../beebase-subscription-service/.env
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://beebase:beebase@subscription-postgres:5432/beebase_subscription?sslmode=disable
    depends_on:
      subscription-postgres:
        condition: service_healthy
      subscription-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  beebase_auth_postgres_data:
  beebase_apiary_postgres_data:
  beebase_hive_postgres_data:
  beebase_inspection_postgres_data:
  beebase_media_postgres_data:
  beebase_subscription_postgres_data:
