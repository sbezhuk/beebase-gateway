name: Production Release

# Combines the 7 independently-versioned BeeBase services into one
# immutable release manifest and deploys it - see this repo's README.md
# ("Production deployment") for the full architecture. This workflow
# never builds or rebuilds anything: it only selects already-pushed,
# already-immutable images by their exact Git SHA (each service's own
# ci.yml is what built and pushed them) and hands the resulting manifest
# to deploy.sh, which remains the one and only place deployment logic
# lives - see deploy/deploy.sh and deploy/lib/manifest.sh.
#
# Manual/protected by design: workflow_dispatch only, gated behind the
# "production" GitHub Environment.

on:
  workflow_dispatch:
    inputs:
      gateway_image_tag:
        description: "Gateway image tag (Git SHA) - overrides the current production gateway image"
        required: false
      auth_image_tag:
        description: "Auth-service image tag (Git SHA) - overrides the current production auth image"
        required: false
      apiary_image_tag:
        description: "Apiary-service image tag (Git SHA) - overrides the current production apiary image"
        required: false
      hive_image_tag:
        description: "Hive-service image tag (Git SHA) - overrides the current production hive image"
        required: false
      inspection_image_tag:
        description: "Inspection-service image tag (Git SHA) - overrides the current production inspection image"
        required: false
      media_image_tag:
        description: "Media-service image tag (Git SHA) - overrides the current production media image"
        required: false
      statistics_image_tag:
        description: "Statistics-service image tag (Git SHA) - overrides the current production statistics image"
        required: false
      subscription_image_tag:
        description: "Subscription-service image tag (Git SHA) - overrides the current production subscription image"
        required: false
      rollback_release:
        description: "Existing release id to roll back to, e.g. 2026.09.07-1. Ignores all image tag inputs."
        required: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1

jobs:
  # Resolves the release manifest (or the rollback target) and verifies
  # every image it names actually exists in ECR - all before the SSM
  # deploy job below ever touches the running stack.
  resolve-and-validate:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      release: ${{ steps.build.outputs.release }}
      manifest_b64: ${{ steps.build.outputs.manifest_b64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC - no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Fails the whole run fast, before any image/manifest work, if any
      # of the 7 services' production .env files (auth.env, gateway.env,
      # ...) is missing, wrong-permissioned or incomplete on the host -
      # deploy.sh re-validates this itself regardless (see deploy.sh and
      # deploy/lib/env_config.sh, the single source of truth for what
      # "valid" means here - never reimplemented in this workflow), but
      # catching it here means a misconfigured host is reported in ~10
      # seconds of CI output instead of after minutes of image pulls and
      # migrations against a stack this run then has to abandon.
      - name: Validate every service's production .env exists on the host
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Validate BeeBase per-service production .env files" \
            --parameters '{"commands":["bash -lc '\''source /opt/beebase/deploy/lib/env_config.sh && env_config_validate_all \"${BEEBASE_CONFIG_DIR:-/opt/beebase/config}\"'\''"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: ${COMMAND_ID}"

          STATUS="Pending"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "${STATUS}" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::One or more service .env files failed validation on the production host - see the standard error below (key names only, never values)"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardErrorContent" \
                  --output text >&2
                exit 1
                ;;
              *)
                sleep 2
                ;;
            esac
          done

          if [ "${STATUS}" != "Success" ]; then
            echo "::error::Timed out while validating per-service production .env files"
            exit 1
          fi

          echo "all 7 service .env files present, mode 0600, and complete"

      - name: Resolve current production manifest
        if: inputs.rollback_release == ''
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Read current BeeBase production release manifest" \
            --parameters '{"commands":["CURRENT_MANIFEST=$(readlink -f /opt/beebase/releases/current) && test -f \"${CURRENT_MANIFEST}\" && cat \"${CURRENT_MANIFEST}\""]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: ${COMMAND_ID}"

          STATUS="Pending"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "${STATUS}" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Failed to read current production manifest: ${STATUS}"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardErrorContent" \
                  --output text >&2
                exit 1
                ;;
              *)
                sleep 2
                ;;
            esac
          done

          if [ "${STATUS}" != "Success" ]; then
            echo "::error::Timed out while reading current production manifest"
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text > /tmp/current-production.env

          echo "--- current production manifest ---"
          cat /tmp/current-production.env

      - name: Build and validate the release manifest (or resolve a rollback target)
        id: build
        env:
          GATEWAY_IMAGE_TAG: ${{ inputs.gateway_image_tag }}
          AUTH_IMAGE_TAG: ${{ inputs.auth_image_tag }}
          APIARY_IMAGE_TAG: ${{ inputs.apiary_image_tag }}
          HIVE_IMAGE_TAG: ${{ inputs.hive_image_tag }}
          INSPECTION_IMAGE_TAG: ${{ inputs.inspection_image_tag }}
          MEDIA_IMAGE_TAG: ${{ inputs.media_image_tag }}
          STATISTICS_IMAGE_TAG: ${{ inputs.statistics_image_tag }}
          SUBSCRIPTION_IMAGE_TAG: ${{ inputs.subscription_image_tag }}
          ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
          RUN_NUMBER: ${{ github.run_number }}
          CURRENT_MANIFEST_FILE: /tmp/current-production.env
        run: |
          set -euo pipefail

          # shellcheck source=deploy/lib/manifest.sh
          source deploy/lib/manifest.sh

          if [ -n "${ROLLBACK_RELEASE}" ]; then
            [[ "${ROLLBACK_RELEASE}" =~ ^[A-Za-z0-9._-]+$ ]] \
              || {
                echo "::error::rollback_release '${ROLLBACK_RELEASE}' contains characters other than [A-Za-z0-9._-]"
                exit 1
              }

            echo "Rolling back to existing release ${ROLLBACK_RELEASE} - no new manifest, nothing rebuilt, nothing re-validated here (deploy.sh re-validates on the host regardless)."

            echo "release=${ROLLBACK_RELEASE}" >> "${GITHUB_OUTPUT}"
            echo "manifest_b64=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Resolve the current production manifest first.
          # Explicit workflow inputs override only the services selected
          # by the user; all other services keep their current production SHA.
          manifest_parse "${CURRENT_MANIFEST_FILE}"
          manifest_validate

          GATEWAY_IMAGE_TAG="${GATEWAY_IMAGE_TAG:-${MANIFEST[GATEWAY_IMAGE_TAG]}}"
          AUTH_IMAGE_TAG="${AUTH_IMAGE_TAG:-${MANIFEST[AUTH_IMAGE_TAG]}}"
          APIARY_IMAGE_TAG="${APIARY_IMAGE_TAG:-${MANIFEST[APIARY_IMAGE_TAG]}}"
          HIVE_IMAGE_TAG="${HIVE_IMAGE_TAG:-${MANIFEST[HIVE_IMAGE_TAG]}}"
          INSPECTION_IMAGE_TAG="${INSPECTION_IMAGE_TAG:-${MANIFEST[INSPECTION_IMAGE_TAG]}}"
          MEDIA_IMAGE_TAG="${MEDIA_IMAGE_TAG:-${MANIFEST[MEDIA_IMAGE_TAG]}}"
          STATISTICS_IMAGE_TAG="${STATISTICS_IMAGE_TAG:-${MANIFEST[STATISTICS_IMAGE_TAG]}}"
          SUBSCRIPTION_IMAGE_TAG="${SUBSCRIPTION_IMAGE_TAG:-${MANIFEST[SUBSCRIPTION_IMAGE_TAG]:-}}"

          RELEASE="$(date -u +%Y.%m.%d)-${RUN_NUMBER}"
          MANIFEST_FILE="$(mktemp)"

          {
            echo "RELEASE=${RELEASE}"
            echo "CREATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for key in "${MANIFEST_SERVICE_TAG_KEYS[@]}"; do
              value="${!key:-}"
              [ -n "${value}" ] \
                || {
                  echo "::error::${key} could not be resolved from current production manifest or workflow input"
                  exit 1
                }
              echo "${key}=${value}"
            done
          } > "${MANIFEST_FILE}"

          manifest_parse "${MANIFEST_FILE}"
          manifest_validate

          echo "--- resolved release manifest ---"
          cat "${MANIFEST_FILE}"

          echo "release=${RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "manifest_b64=$(base64 -w0 "${MANIFEST_FILE}")" >> "${GITHUB_OUTPUT}"

      - name: Verify every manifest image exists in ECR
        if: inputs.rollback_release == ''
        env:
          MANIFEST_B64: ${{ steps.build.outputs.manifest_b64 }}
        run: |
          set -euo pipefail

          # shellcheck source=deploy/lib/manifest.sh
          source deploy/lib/manifest.sh

          MANIFEST_FILE="$(mktemp)"
          echo "${MANIFEST_B64}" | base64 -d > "${MANIFEST_FILE}"

          manifest_parse "${MANIFEST_FILE}"
          manifest_validate

          for key in "${MANIFEST_SERVICE_TAG_KEYS[@]}"; do
            repo="${MANIFEST_ECR_REPO[${key}]}"
            tag="${MANIFEST[${key}]}"

            echo "checking ${repo}:${tag}"

            aws ecr describe-images \
              --region "${AWS_REGION}" \
              --repository-name "${repo}" \
              --image-ids "imageTag=${tag}" \
              >/dev/null \
              || {
                echo "::error::image ${repo}:${tag} (${key}) not found in ECR - refusing to release"
                exit 1
              }
          done

          for key in "${MANIFEST_MIGRATE_TAG_KEYS[@]}"; do
            repo="${MANIFEST_ECR_REPO[${key}]}"
            tag="${MANIFEST[${key}]}-migrate"

            echo "checking ${repo}:${tag}"

            aws ecr describe-images \
              --region "${AWS_REGION}" \
              --repository-name "${repo}" \
              --image-ids "imageTag=${tag}" \
              >/dev/null \
              || {
                echo "::error::image ${repo}:${tag} (${key}) not found in ECR - refusing to release"
                exit 1
              }
          done

          echo "all required images present in ECR"

  # Ships the resolved immutable manifest to the EC2 host and runs
  # deploy.sh against it via SSM.
  deploy:
    needs: resolve-and-validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials (OIDC - no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send manifest + run deploy.sh via SSM
        env:
          RELEASE: ${{ needs.resolve-and-validate.outputs.release }}
          MANIFEST_B64: ${{ needs.resolve-and-validate.outputs.manifest_b64 }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          MANIFEST_FILE="/opt/beebase/releases/${RELEASE}.env"

          COMMANDS=(
            "set -euo pipefail"
            "mkdir -p /opt/beebase/releases"
          )

          if [ -n "${MANIFEST_B64}" ]; then
            COMMANDS+=(
              "if [ -e '${MANIFEST_FILE}' ]; then echo 'release manifest ${MANIFEST_FILE} already exists - releases are immutable' >&2; exit 1; fi"
              "umask 022"
              "echo '${MANIFEST_B64}' | base64 -d > '${MANIFEST_FILE}'"
            )
          else
            COMMANDS+=(
              "test -f '${MANIFEST_FILE}' || { echo 'rollback target ${MANIFEST_FILE} does not exist on the host' >&2; exit 1; }"
            )
          fi

          COMMANDS+=(
            "/opt/beebase/deploy/deploy.sh '${MANIFEST_FILE}'"
          )

          # Built with jq (not hand-escaped string interpolation) so the
          # base64 manifest payload and every command are safely
          # JSON-encoded regardless of their contents.
          PARAMS_JSON=$(
            printf '%s\n' "${COMMANDS[@]}" |
              jq -R -s -c '{commands: (split("\n")[:-1])}'
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Release ${RELEASE}" \
            --parameters "${PARAMS_JSON}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: ${COMMAND_ID}"

          # deploy.sh performs the complete deployment gate:
          # image checks, pulls, migrations, recreation, health checks
          # and smoke tests.
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "${STATUS}" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Release failed with status: ${STATUS}"

                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardErrorContent" \
                  --output text >&2

                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          if [ "${STATUS}" != "Success" ]; then
            echo "::error::Release did not finish within the timeout"
            exit 1
          fi

          echo "--- deploy.sh output ---"

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text