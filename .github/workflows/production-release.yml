name: Production Release

# Combines the 7 independently-versioned BeeBase services into one
# immutable release manifest and deploys it - see this repo's README.md
# ("Production deployment") for the full architecture. This workflow
# never builds or rebuilds anything: it only selects already-pushed,
# already-immutable images by their exact Git SHA (each service's own
# ci.yml is what built and pushed them) and hands the resulting manifest
# to deploy.sh, which remains the one and only place deployment logic
# lives - see deploy/deploy.sh and deploy/lib/manifest.sh.
#
# Manual/protected by design: workflow_dispatch only, gated behind the
# "production" GitHub Environment (configure required reviewers there -
# see README.md's "Azure DevOps configuration required" ... now
# "GitHub configuration required" section for the one-time setup).
on:
  workflow_dispatch:
    inputs:
      gateway_image_tag:
        description: "gateway image tag (Git SHA) - required unless rollback_release is set"
        required: false
      auth_image_tag:
        description: "auth-service image tag (Git SHA)"
        required: false
      apiary_image_tag:
        description: "apiary-service image tag (Git SHA)"
        required: false
      hive_image_tag:
        description: "hive-service image tag (Git SHA)"
        required: false
      inspection_image_tag:
        description: "inspection-service image tag (Git SHA)"
        required: false
      media_image_tag:
        description: "media-service image tag (Git SHA)"
        required: false
      statistics_image_tag:
        description: "statistics-service image tag (Git SHA)"
        required: false
      rollback_release:
        description: "Roll back instead: an existing release id already under /opt/beebase/releases/ (e.g. 2026.09.07-1). When set, every *_image_tag input above is ignored - nothing is rebuilt or re-validated, deploy.sh simply redeploys that manifest's exact images."
        required: false

permissions:
  contents: read
  id-token: write # exchanged for short-lived AWS credentials below - no long-lived keys stored in GitHub

env:
  AWS_REGION: eu-central-1

jobs:
  # Resolves the release manifest (or the rollback target) and verifies
  # every image it names actually exists in ECR - all before the SSM
  # deploy job below ever touches the running stack. Gated by the same
  # `production` Environment as the deploy job: GitHub only issues the
  # `environment:production` OIDC claim the release IAM role trusts (see
  # terraform/modules/github-oidc) to a job declaring this environment,
  # and a required-reviewers rule on it (configured in GitHub, not here)
  # blocks BOTH jobs on one approval before either can run.
  resolve-and-validate:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      release: ${{ steps.build.outputs.release }}
      manifest_b64: ${{ steps.build.outputs.manifest_b64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate the release manifest (or resolve a rollback target)
        id: build
        env:
          GATEWAY_IMAGE_TAG: ${{ inputs.gateway_image_tag }}
          AUTH_IMAGE_TAG: ${{ inputs.auth_image_tag }}
          APIARY_IMAGE_TAG: ${{ inputs.apiary_image_tag }}
          HIVE_IMAGE_TAG: ${{ inputs.hive_image_tag }}
          INSPECTION_IMAGE_TAG: ${{ inputs.inspection_image_tag }}
          MEDIA_IMAGE_TAG: ${{ inputs.media_image_tag }}
          STATISTICS_IMAGE_TAG: ${{ inputs.statistics_image_tag }}
          ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # shellcheck source=deploy/lib/manifest.sh
          source deploy/lib/manifest.sh

          if [ -n "${ROLLBACK_RELEASE}" ]; then
            [[ "${ROLLBACK_RELEASE}" =~ ^[A-Za-z0-9._-]+$ ]] \
              || { echo "::error::rollback_release '${ROLLBACK_RELEASE}' contains characters other than [A-Za-z0-9._-]"; exit 1; }
            echo "Rolling back to existing release ${ROLLBACK_RELEASE} - no new manifest, nothing rebuilt, nothing re-validated here (deploy.sh re-validates on the host regardless)."
            echo "release=${ROLLBACK_RELEASE}" >>"${GITHUB_OUTPUT}"
            echo "manifest_b64=" >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          RELEASE="$(date -u +%Y.%m.%d)-${RUN_NUMBER}"
          MANIFEST_FILE="$(mktemp)"
          {
            echo "RELEASE=${RELEASE}"
            echo "CREATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for key in "${MANIFEST_SERVICE_TAG_KEYS[@]}"; do
              value="${!key:-}"
              [ -n "${value}" ] || { echo "::error::${key} is required unless rollback_release is set"; exit 1; }
              echo "${key}=${value}"
            done
          } >"${MANIFEST_FILE}"

          manifest::parse "${MANIFEST_FILE}"
          manifest::validate

          echo "--- resolved release manifest ---"
          cat "${MANIFEST_FILE}"

          echo "release=${RELEASE}" >>"${GITHUB_OUTPUT}"
          echo "manifest_b64=$(base64 -w0 "${MANIFEST_FILE}")" >>"${GITHUB_OUTPUT}"

      - name: Configure AWS credentials (OIDC - no long-lived keys)
        if: inputs.rollback_release == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify every manifest image exists in ECR
        if: inputs.rollback_release == ''
        env:
          GATEWAY_IMAGE_TAG: ${{ inputs.gateway_image_tag }}
          AUTH_IMAGE_TAG: ${{ inputs.auth_image_tag }}
          APIARY_IMAGE_TAG: ${{ inputs.apiary_image_tag }}
          HIVE_IMAGE_TAG: ${{ inputs.hive_image_tag }}
          INSPECTION_IMAGE_TAG: ${{ inputs.inspection_image_tag }}
          MEDIA_IMAGE_TAG: ${{ inputs.media_image_tag }}
          STATISTICS_IMAGE_TAG: ${{ inputs.statistics_image_tag }}
        run: |
          set -euo pipefail
          # shellcheck source=deploy/lib/manifest.sh
          source deploy/lib/manifest.sh

          for key in "${MANIFEST_SERVICE_TAG_KEYS[@]}"; do
            repo="${MANIFEST_ECR_REPO[${key}]}"
            tag="${!key}"
            echo "checking ${repo}:${tag}"
            aws ecr describe-images --region "${AWS_REGION}" --repository-name "${repo}" --image-ids "imageTag=${tag}" >/dev/null \
              || { echo "::error::image ${repo}:${tag} (${key}) not found in ECR - refusing to release"; exit 1; }
          done
          for key in "${MANIFEST_MIGRATE_TAG_KEYS[@]}"; do
            repo="${MANIFEST_ECR_REPO[${key}]}"
            tag="${!key}-migrate"
            echo "checking ${repo}:${tag}"
            aws ecr describe-images --region "${AWS_REGION}" --repository-name "${repo}" --image-ids "imageTag=${tag}" >/dev/null \
              || { echo "::error::image ${repo}:${tag} not found in ECR - refusing to release"; exit 1; }
          done
          echo "all required images present in ECR"

  # Ships the manifest to the EC2 host and runs deploy.sh against it via
  # SSM - deploy.sh itself re-validates the manifest, re-checks ECR,
  # pulls, migrates, recreates the stack, health-checks and smoke-tests.
  # This job only ever orchestrates that one command; it never
  # reimplements any part of it.
  deploy:
    needs: resolve-and-validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials (OIDC - no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send manifest + run deploy.sh via SSM
        env:
          RELEASE: ${{ needs.resolve-and-validate.outputs.release }}
          MANIFEST_B64: ${{ needs.resolve-and-validate.outputs.manifest_b64 }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          MANIFEST_FILE="/opt/beebase/releases/${RELEASE}.env"

          COMMANDS=("set -euo pipefail" "mkdir -p /opt/beebase/releases")
          if [ -n "${MANIFEST_B64}" ]; then
            COMMANDS+=(
              "if [ -e '${MANIFEST_FILE}' ]; then echo 'release manifest ${MANIFEST_FILE} already exists - releases are immutable' >&2; exit 1; fi"
              "umask 022"
              "echo '${MANIFEST_B64}' | base64 -d > '${MANIFEST_FILE}'"
            )
          else
            COMMANDS+=("test -f '${MANIFEST_FILE}' || { echo 'rollback target ${MANIFEST_FILE} does not exist on the host' >&2; exit 1; }")
          fi
          COMMANDS+=("/opt/beebase/deploy/deploy.sh '${MANIFEST_FILE}'")

          # Built with jq (not hand-escaped string interpolation) so the
          # base64 manifest payload and every command are safely
          # JSON-encoded regardless of what characters they contain.
          PARAMS_JSON=$(printf '%s\n' "${COMMANDS[@]}" | jq -R -s -c '{commands: (split("\n")[:-1])}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Release ${RELEASE}" \
            --parameters "${PARAMS_JSON}" \
            --query "Command.CommandId" --output text)

          echo "SSM command: ${COMMAND_ID}"

          # Poll until the command finishes - deploy.sh itself runs the
          # full stack + migrations + health checks + smoke tests, so
          # this is the single gate the whole release hangs on.
          # shellcheck disable=SC2034 # loop counter only bounds the retry count
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "${STATUS}" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Release failed with status: ${STATUS}"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query "StandardErrorContent" --output text >&2
                exit 1
                ;;
              *) sleep 10 ;;
            esac
          done

          if [ "${STATUS}" != "Success" ]; then
            echo "::error::Release did not finish within the timeout"
            exit 1
          fi

          echo "--- deploy.sh output ---"
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "StandardOutputContent" --output text
