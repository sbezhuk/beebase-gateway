# Production stack for the single-EC2 BeeBase MVP. Lives beside (and is
# fully independent of) docker-compose.yml, which remains the local dev
# entrypoint and is untouched by this file.
#
# Run from /opt/beebase/compose on the production host (see deploy.sh).
# Every image reference and secret comes from the environment - this
# file has no defaults that silently fall back to "latest" or to a
# built-in password, by design:
#   - ECR_REGISTRY, IMAGE_TAG: required, no default (see the ${VAR:?...}
#     guards below) - a missing IMAGE_TAG fails the `docker compose`
#     invocation instead of silently reusing whatever "latest" happens
#     to resolve to.
#   - Secrets (JWT_PRIVATE_KEY, TOTP_ENCRYPTION_KEY, POSTGRES_*_PASSWORD)
#     come from a .env file deploy.sh generates fresh from SSM Parameter
#     Store on every deploy - never committed, never baked into an
#     image. Media storage needs no static secret at all: media-service
#     authenticates to S3 via the EC2 instance's IAM role.
#
# Only the `edge` (Caddy) service publishes a host port. Every other
# container - gateway included - is reachable solely on the internal
# `beebase` Docker network.
#
# Sized for a t4g.micro (1GiB RAM) host: every service below carries a
# conservative mem_limit/mem_reservation, the 5 PostgreSQL instances are
# tuned down from their (surprisingly high, for 5-on-one-host)
# out-of-the-box defaults, and Redis's AOF persistence is disabled - see
# each section's own comment for the reasoning. This is a tight fit, not
# a comfortable one; see the deployment report for the full capacity
# analysis and its residual risk.

# Identical across all 5 PostgreSQL instances, so defined once. Default
# shared_buffers alone is 128MB - five instances at the default would be
# 640MB before anything else starts, which alone doesn't fit a 1GiB host.
x-pg-tuning-flags: &pg-tuning-flags
  - postgres
  - -c
  - shared_buffers=16MB
  - -c
  - work_mem=2MB
  - -c
  - maintenance_work_mem=32MB
  - -c
  - max_connections=20
  - -c
  - effective_cache_size=96MB

services:
  # --- edge: TLS termination, sole public entry point ---

  edge:
    image: caddy:2.9-alpine
    restart: unless-stopped
    mem_limit: 32m
    mem_reservation: 16m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../config/Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's own ACME-obtained Let's Encrypt certificate/key live here,
      # not as a mounted file - this volume is what makes them survive a
      # container restart instead of being re-requested every time.
      - caddy-data:/data
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN, e.g. api.beebase.club}
    networks: [beebase]
    depends_on:
      gateway:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/infra
        awslogs-stream: edge-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  # --- gateway: sole application entry point behind edge ---

  gateway:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-gateway:${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
    restart: unless-stopped
    mem_limit: 48m
    mem_reservation: 16m
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      HTTP_PORT: "8080"
      # Soft cap for the Go runtime's GC, kept below the hard mem_limit
      # above so the GC reacts to memory pressure before Docker's OOM
      # killer would - see the deployment report's t4g.micro sizing note.
      GOMEMLIMIT: 40MiB
      AUTH_SERVICE_URL: http://auth-service:8080
      APIARY_SERVICE_URL: http://apiary-service:8080
      HIVE_SERVICE_URL: http://hive-service:8080
      INSPECTION_SERVICE_URL: http://inspection-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      STATISTICS_SERVICE_URL: http://statistics-service:8080
    networks: [beebase]
    depends_on:
      auth-service: { condition: service_healthy }
      apiary-service: { condition: service_healthy }
      hive-service: { condition: service_healthy }
      inspection-service: { condition: service_healthy }
      media-service: { condition: service_healthy }
      statistics-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-gateway
        awslogs-stream: app-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  # --- auth-service ---

  auth-service:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-auth-service:${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
    restart: unless-stopped
    mem_limit: 48m
    mem_reservation: 16m
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      HTTP_PORT: "8080"
      GOMEMLIMIT: 40MiB
      DATABASE_URL: postgres://beebase:${POSTGRES_AUTH_PASSWORD:?set POSTGRES_AUTH_PASSWORD}@postgres-auth:5432/beebase_auth?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set JWT_PRIVATE_KEY}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      # Empty (the app's own default, see auth-service's config.go) is
      # correct here, not a placeholder needing a value: the refresh
      # cookie only ever needs to be read back by api.beebase.club
      # itself - there's no separate first-party subdomain in this
      # architecture that also needs it, so "host only" is the right
      # scope, not a shared-parent-domain leading dot. Left as an
      # optional override (:-, not :?) rather than removed entirely, in
      # case that ever changes.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY}
      TOTP_ISSUER: BeeBase
      MEDIA_SERVICE_URL: http://media-service:8080
      APIARY_SERVICE_URL: http://apiary-service:8080
    networks: [beebase]
    depends_on:
      postgres-auth: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-auth: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-auth-service
        awslogs-stream: app-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  # --- apiary-service ---

  apiary-service:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-apiary-service:${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
    restart: unless-stopped
    mem_limit: 48m
    mem_reservation: 16m
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      HTTP_PORT: "8080"
      GOMEMLIMIT: 40MiB
      DATABASE_URL: postgres://beebase:${POSTGRES_APIARY_PASSWORD:?set POSTGRES_APIARY_PASSWORD}@postgres-apiary:5432/beebase_apiary?sslmode=disable
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      REDIS_ADDR: redis:6379
      HIVE_SERVICE_URL: http://hive-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    networks: [beebase]
    depends_on:
      postgres-apiary: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-apiary: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-apiary-service
        awslogs-stream: app-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  # --- hive-service ---

  hive-service:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-hive-service:${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
    restart: unless-stopped
    mem_limit: 48m
    mem_reservation: 16m
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      HTTP_PORT: "8080"
      GOMEMLIMIT: 40MiB
      DATABASE_URL: postgres://beebase:${POSTGRES_HIVE_PASSWORD:?set POSTGRES_HIVE_PASSWORD}@postgres-hive:5432/beebase_hive?sslmode=disable
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      REDIS_ADDR: redis:6379
      APIARY_SERVICE_URL: http://apiary-service:8080
      INSPECTION_SERVICE_URL: http://inspection-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    networks: [beebase]
    depends_on:
      postgres-hive: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      apiary-service: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-hive: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-hive-service
        awslogs-stream: app-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  # --- inspection-service ---

  inspection-service:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-inspection-service:${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
    restart: unless-stopped
    mem_limit: 48m
    mem_reservation: 16m
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      HTTP_PORT: "8080"
      GOMEMLIMIT: 40MiB
      DATABASE_URL: postgres://beebase:${POSTGRES_INSPECTION_PASSWORD:?set POSTGRES_INSPECTION_PASSWORD}@postgres-inspection:5432/beebase_inspection?sslmode=disable
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      REDIS_ADDR: redis:6379
      HIVE_SERVICE_URL: http://hive-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    networks: [beebase]
    depends_on:
      postgres-inspection: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      hive-service: { condition: service_healthy }
      media-service: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-inspection: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-inspection-service
        awslogs-stream: app-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  # --- media-service ---

  media-service:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-media-service:${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
    restart: unless-stopped
    mem_limit: 48m
    mem_reservation: 16m
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      HTTP_PORT: "8080"
      GOMEMLIMIT: 40MiB
      DATABASE_URL: postgres://beebase:${POSTGRES_MEDIA_PASSWORD:?set POSTGRES_MEDIA_PASSWORD}@postgres-media:5432/beebase_media?sslmode=disable
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      REDIS_ADDR: redis:6379
      PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      # Media blobs live in Amazon S3. No STORAGE_ACCESS_KEY_ID/
      # STORAGE_SECRET_ACCESS_KEY here, deliberately: the container
      # authenticates to S3 via the EC2 instance's IAM role (see
      # terraform/modules/iam), resolved automatically by the AWS SDK's
      # default credential chain - no static key ever exists on this
      # host or in this image. STORAGE_ENDPOINT is also left unset, so
      # the SDK uses S3's normal regional endpoint rather than an
      # R2-style override.
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET}
      STORAGE_REGION: ${AWS_REGION:?set AWS_REGION}
    networks: [beebase]
    depends_on:
      postgres-media: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-media: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-media-service
        awslogs-stream: app-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  # --- statistics-service (stateless, no database of its own) ---

  statistics-service:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-statistics-service:${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
    restart: unless-stopped
    mem_limit: 48m
    mem_reservation: 16m
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      HTTP_PORT: "8080"
      GOMEMLIMIT: 40MiB
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      REDIS_ADDR: redis:6379
      APIARY_SERVICE_URL: http://apiary-service:8080
      HIVE_SERVICE_URL: http://hive-service:8080
      INSPECTION_SERVICE_URL: http://inspection-service:8080
    networks: [beebase]
    depends_on:
      auth-service: { condition: service_healthy }
      apiary-service: { condition: service_healthy }
      hive-service: { condition: service_healthy }
      inspection-service: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-statistics-service
        awslogs-stream: app-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  # --- PostgreSQL, one container per bounded context, each on its own
  #     bind-mounted directory on the dedicated EBS data volume. No host
  #     port is published for any of them - only reachable from other
  #     containers on the `beebase` network. ---

  postgres-auth:
    image: postgres:16-alpine
    restart: unless-stopped
    command: *pg-tuning-flags
    mem_limit: 64m
    mem_reservation: 32m
    environment:
      POSTGRES_USER: beebase
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:?set POSTGRES_AUTH_PASSWORD}
      POSTGRES_DB: beebase_auth
    volumes:
      - /mnt/beebase-data/postgres/auth:/var/lib/postgresql/data
    networks: [beebase]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/infra
        awslogs-stream: postgres-auth-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  postgres-apiary:
    image: postgres:16-alpine
    restart: unless-stopped
    command: *pg-tuning-flags
    mem_limit: 64m
    mem_reservation: 32m
    environment:
      POSTGRES_USER: beebase
      POSTGRES_PASSWORD: ${POSTGRES_APIARY_PASSWORD:?set POSTGRES_APIARY_PASSWORD}
      POSTGRES_DB: beebase_apiary
    volumes:
      - /mnt/beebase-data/postgres/apiary:/var/lib/postgresql/data
    networks: [beebase]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_apiary"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/infra
        awslogs-stream: postgres-apiary-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  postgres-hive:
    image: postgres:16-alpine
    restart: unless-stopped
    command: *pg-tuning-flags
    mem_limit: 64m
    mem_reservation: 32m
    environment:
      POSTGRES_USER: beebase
      POSTGRES_PASSWORD: ${POSTGRES_HIVE_PASSWORD:?set POSTGRES_HIVE_PASSWORD}
      POSTGRES_DB: beebase_hive
    volumes:
      - /mnt/beebase-data/postgres/hive:/var/lib/postgresql/data
    networks: [beebase]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_hive"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/infra
        awslogs-stream: postgres-hive-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  postgres-inspection:
    image: postgres:16-alpine
    restart: unless-stopped
    command: *pg-tuning-flags
    mem_limit: 64m
    mem_reservation: 32m
    environment:
      POSTGRES_USER: beebase
      POSTGRES_PASSWORD: ${POSTGRES_INSPECTION_PASSWORD:?set POSTGRES_INSPECTION_PASSWORD}
      POSTGRES_DB: beebase_inspection
    volumes:
      - /mnt/beebase-data/postgres/inspection:/var/lib/postgresql/data
    networks: [beebase]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_inspection"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/infra
        awslogs-stream: postgres-inspection-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  postgres-media:
    image: postgres:16-alpine
    restart: unless-stopped
    command: *pg-tuning-flags
    mem_limit: 64m
    mem_reservation: 32m
    environment:
      POSTGRES_USER: beebase
      POSTGRES_PASSWORD: ${POSTGRES_MEDIA_PASSWORD:?set POSTGRES_MEDIA_PASSWORD}
      POSTGRES_DB: beebase_media
    volumes:
      - /mnt/beebase-data/postgres/media:/var/lib/postgresql/data
    networks: [beebase]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_media"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/infra
        awslogs-stream: postgres-media-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  # --- Redis: shared single-active-session store ---
  #
  # No host port published, no AUTH (the app doesn't support it yet -
  # see the deployment report's risk list) - network isolation on the
  # internal-only `beebase` network is the control here. AOF persistence
  # is disabled (t4g.micro sizing: AOF's continuous rewrite/fsync
  # overhead isn't worth it here) - not required for correctness either
  # way, since a lost session marker just costs the affected user one
  # extra refresh round-trip (see beebase-auth-service's issueSession,
  # which re-Activates on every login/refresh/setup). The image's default
  # periodic RDB snapshotting (to the `redis-data` volume) is left as-is:
  # near-zero cost given how tiny this dataset is, and it's a free bit of
  # extra durability on top of the documented in-app fallback.
  # maxmemory bounds the dataset itself (one small key per active user,
  # TTL-bound) well under the container's own mem_limit below, which
  # covers Redis's own process/connection overhead on top of that.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 48m
    mem_reservation: 16m
    volumes:
      - redis-data:/data
    networks: [beebase]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/infra
        awslogs-stream: redis-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  # --- Migrations: one-shot per database, gated before its app service
  #     starts. Images are pre-built with the SQL files baked in (see
  #     each service's Dockerfile.migrate) and tagged <sha>-migrate
  #     alongside the app image - the host never checks out source. ---

  migrate-auth:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-auth-service:${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}-migrate
    restart: "no"
    mem_limit: 64m
    command:
      - -path=/migrations
      - -database=postgres://beebase:${POSTGRES_AUTH_PASSWORD:?set POSTGRES_AUTH_PASSWORD}@postgres-auth:5432/beebase_auth?sslmode=disable
      - up
    networks: [beebase]
    depends_on:
      postgres-auth: { condition: service_healthy }
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-auth-service
        awslogs-stream: migrate-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  migrate-apiary:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-apiary-service:${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}-migrate
    restart: "no"
    mem_limit: 64m
    command:
      - -path=/migrations
      - -database=postgres://beebase:${POSTGRES_APIARY_PASSWORD:?set POSTGRES_APIARY_PASSWORD}@postgres-apiary:5432/beebase_apiary?sslmode=disable
      - up
    networks: [beebase]
    depends_on:
      postgres-apiary: { condition: service_healthy }
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-apiary-service
        awslogs-stream: migrate-${IMAGE_TAG:?set IMAGE_TAG to a Git commit SHA}
        awslogs-create-group: "true"

  migrate-hive:
