# Production stack for the single-EC2 BeeBase MVP. Lives beside (and is
# fully independent of) docker-compose.yml, which remains the local dev
# entrypoint and is untouched by this file.
#
# Run from /opt/beebase/compose on the production host (see deploy.sh).
# Every image reference and secret comes from the environment - this
# file has no defaults that silently fall back to "latest" or to a
# built-in password, by design:
#   - ECR_REGISTRY: required, no default (see the ${VAR:?...} guards
#     below).
#   - Each of the 7 services is an independent Git repository with its
#     own pipeline and its own commit SHA, so there is deliberately no
#     single shared IMAGE_TAG - each service has its own
#     <SERVICE>_IMAGE_TAG variable (GATEWAY_IMAGE_TAG, AUTH_IMAGE_TAG,
#     APIARY_IMAGE_TAG, HIVE_IMAGE_TAG, INSPECTION_IMAGE_TAG,
#     MEDIA_IMAGE_TAG, STATISTICS_IMAGE_TAG), all required, none
#     defaulted. Together, one value per variable, they form a release
#     manifest - see deploy/lib/manifest.sh and deploy/deploy.sh, which
#     is the only thing that ever sets them. RELEASE is the manifest's
#     own identifier (e.g. 2026.09.07-1), used only for log-stream
#     naming on services that have no image tag of their own (edge,
#     postgres, redis) - it never substitutes for an image tag.
#
#   - Each of the 7 application services owns its own production .env at
#     ${BEEBASE_CONFIG_DIR:-../config}/<service>.env (gateway.env,
#     auth.env, apiary.env, hive.env, inspection.env, media.env,
#     statistics.env - see deploy/lib/env_config.sh for the exact
#     mapping and required-key lists, and deploy/env-templates/ for the
#     per-service templates an operator provisions them from). Every
#     application service below loads its own file, and only its own
#     file, via `env_file:` - a service never sees another service's
#     secrets. These files are provisioned once by an operator and never
#     rewritten by deploy.sh; they are never stored in this repo, a
#     release manifest, a Docker image, or AWS SSM Parameter Store - see
#     deploy/lib/env_config.sh and deploy.sh's validation step, which
#     refuses to touch the running stack unless every one of the 7 files
#     exists, is mode 0600, and has every required key set.
#
#   - One narrow exception: Compose's own ${VAR} interpolation (used
#     below by every postgres-* container's POSTGRES_PASSWORD and every
#     migrate-* job's `-database=...` command argument) can only ever
#     read from the single file passed via `docker compose --env-file`
#     - it has no way to reach into another service's `env_file:`
#     contents, which are injected straight into that one container's
#     runtime environment and nowhere else. deploy.sh resolves this by
#     regenerating ${BEEBASE_CONFIG_DIR:-../config}/deploy.env fresh on
#     every deploy: non-secret deploy-computed values (ECR_REGISTRY,
#     AWS_REGION, RELEASE, every *_IMAGE_TAG, PUBLIC_DOMAIN,
#     BEEBASE_CONFIG_DIR itself) plus a same-deploy copy of each
#     POSTGRES_*_PASSWORD, read from that service's own .env (never
#     logged). deploy.env is passed to `docker compose --env-file` and
#     is what every ${VAR} below resolves against; it is regenerated
#     from the 7 authoritative per-service files on every deploy and is
#     never operator-edited, so it is a derived cache, not a second
#     source of truth. Media storage needs no static secret at all:
#     media-service authenticates to S3 via the EC2 instance's IAM role.
#
# Only the `edge` (Caddy) service publishes a host port. Every other
# container - gateway included - is reachable solely on the internal
# `beebase` Docker network.
#
# Sized for a t4g.micro (1GiB RAM) host: every service below carries a
# conservative mem_limit/mem_reservation, the 5 PostgreSQL instances are
# tuned down from their (surprisingly high, for 5-on-one-host)
# out-of-the-box defaults, and Redis's AOF persistence is disabled - see
# each section's own comment for the reasoning. This is a tight fit, not
# a comfortable one; see the deployment report for the full capacity
# analysis and its residual risk.

# Identical across all 5 PostgreSQL instances, so defined once. Default
# shared_buffers alone is 128MB - five instances at the default would be
# 640MB before anything else starts, which alone doesn't fit a 1GiB host.
x-pg-tuning-flags: &pg-tuning-flags
  - postgres
  - -c
  - shared_buffers=16MB
  - -c
  - work_mem=2MB
  - -c
  - maintenance_work_mem=32MB
  - -c
  - max_connections=20
  - -c
  - effective_cache_size=96MB

services:
  # --- edge: TLS termination, sole public entry point ---

  edge:
    image: caddy:2.9-alpine
    restart: unless-stopped
    mem_limit: 32m
    mem_reservation: 16m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../config/Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's own ACME-obtained Let's Encrypt certificate/key live here,
      # not as a mounted file - this volume is what makes them survive a
      # container restart instead of being re-requested every time.
      - caddy-data:/data
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN, e.g. api.beebase.club}
    networks: [beebase]
    depends_on:
      gateway:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/infra
        awslogs-stream: edge-${RELEASE:?set RELEASE to the release manifest identifier}
        awslogs-create-group: "true"

  # --- gateway: sole application entry point behind edge ---

  gateway:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-gateway:${GATEWAY_IMAGE_TAG:?set GATEWAY_IMAGE_TAG to gateway's Git commit SHA}
    restart: unless-stopped
    mem_limit: 48m
    mem_reservation: 16m
    env_file:
      - ${BEEBASE_CONFIG_DIR:-../config}/gateway.env
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      # Soft cap for the Go runtime's GC, kept below the hard mem_limit
      # above so the GC reacts to memory pressure before Docker's OOM
      # killer would - see the deployment report's t4g.micro sizing note.
      GOMEMLIMIT: 40MiB
      AUTH_SERVICE_URL: http://auth-service:8080
      APIARY_SERVICE_URL: http://apiary-service:8080
      HIVE_SERVICE_URL: http://hive-service:8080
      INSPECTION_SERVICE_URL: http://inspection-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      STATISTICS_SERVICE_URL: http://statistics-service:8080
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8080
    networks: [beebase]
    depends_on:
      auth-service: { condition: service_healthy }
      apiary-service: { condition: service_healthy }
      hive-service: { condition: service_healthy }
      inspection-service: { condition: service_healthy }
      media-service: { condition: service_healthy }
      statistics-service: { condition: service_healthy }
      subscription-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-gateway
        awslogs-stream: app-${GATEWAY_IMAGE_TAG:?set GATEWAY_IMAGE_TAG to gateway's Git commit SHA}
        awslogs-create-group: "true"

  # --- auth-service ---

  auth-service:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-auth-service:${AUTH_IMAGE_TAG:?set AUTH_IMAGE_TAG to auth-service's Git commit SHA}
    restart: unless-stopped
    mem_limit: 48m
    mem_reservation: 16m
    # JWT_PRIVATE_KEY, TOTP_ENCRYPTION_KEY and (optionally) COOKIE_DOMAIN
    # come from auth.env - auth-service's own production secrets, never
    # duplicated here (see this file's header comment and
    # deploy/env-templates/auth.env.example). Leaving COOKIE_DOMAIN unset
    # in auth.env falls through to the app's own default (empty/host-only,
    # correct for the current single-domain deployment - see
    # beebase-auth-service's config.go), so no compose-level default is
    # needed for it any more either.
    env_file:
      - ${BEEBASE_CONFIG_DIR:-../config}/auth.env
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      GOMEMLIMIT: 40MiB
      DATABASE_URL: postgres://beebase:${POSTGRES_AUTH_PASSWORD:?set POSTGRES_AUTH_PASSWORD}@postgres-auth:5432/beebase_auth?sslmode=disable
      REDIS_ADDR: redis:6379
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      TOTP_ISSUER: BeeBase
      MEDIA_SERVICE_URL: http://media-service:8080
      APIARY_SERVICE_URL: http://apiary-service:8080
    networks: [beebase]
    depends_on:
      postgres-auth: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-auth: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-auth-service
        awslogs-stream: app-${AUTH_IMAGE_TAG:?set AUTH_IMAGE_TAG to auth-service's Git commit SHA}
        awslogs-create-group: "true"

  # --- apiary-service ---

  apiary-service:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-apiary-service:${APIARY_IMAGE_TAG:?set APIARY_IMAGE_TAG to apiary-service's Git commit SHA}
    restart: unless-stopped
    mem_limit: 48m
    mem_reservation: 16m
    env_file:
      - ${BEEBASE_CONFIG_DIR:-../config}/apiary.env
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      GOMEMLIMIT: 40MiB
      DATABASE_URL: postgres://beebase:${POSTGRES_APIARY_PASSWORD:?set POSTGRES_APIARY_PASSWORD}@postgres-apiary:5432/beebase_apiary?sslmode=disable
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      REDIS_ADDR: redis:6379
      HIVE_SERVICE_URL: http://hive-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    networks: [beebase]
    depends_on:
      postgres-apiary: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-apiary: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-apiary-service
        awslogs-stream: app-${APIARY_IMAGE_TAG:?set APIARY_IMAGE_TAG to apiary-service's Git commit SHA}
        awslogs-create-group: "true"

  # --- hive-service ---

  hive-service:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-hive-service:${HIVE_IMAGE_TAG:?set HIVE_IMAGE_TAG to hive-service's Git commit SHA}
    restart: unless-stopped
    mem_limit: 48m
    mem_reservation: 16m
    env_file:
      - ${BEEBASE_CONFIG_DIR:-../config}/hive.env
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      GOMEMLIMIT: 40MiB
      DATABASE_URL: postgres://beebase:${POSTGRES_HIVE_PASSWORD:?set POSTGRES_HIVE_PASSWORD}@postgres-hive:5432/beebase_hive?sslmode=disable
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      REDIS_ADDR: redis:6379
      APIARY_SERVICE_URL: http://apiary-service:8080
      INSPECTION_SERVICE_URL: http://inspection-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    networks: [beebase]
    depends_on:
      postgres-hive: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      apiary-service: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-hive: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-hive-service
        awslogs-stream: app-${HIVE_IMAGE_TAG:?set HIVE_IMAGE_TAG to hive-service's Git commit SHA}
        awslogs-create-group: "true"

  # --- inspection-service ---

  inspection-service:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-inspection-service:${INSPECTION_IMAGE_TAG:?set INSPECTION_IMAGE_TAG to inspection-service's Git commit SHA}
    restart: unless-stopped
    mem_limit: 48m
    mem_reservation: 16m
    env_file:
      - ${BEEBASE_CONFIG_DIR:-../config}/inspection.env
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      GOMEMLIMIT: 40MiB
      DATABASE_URL: postgres://beebase:${POSTGRES_INSPECTION_PASSWORD:?set POSTGRES_INSPECTION_PASSWORD}@postgres-inspection:5432/beebase_inspection?sslmode=disable
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      REDIS_ADDR: redis:6379
      HIVE_SERVICE_URL: http://hive-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    networks: [beebase]
    depends_on:
      postgres-inspection: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      hive-service: { condition: service_healthy }
      media-service: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-inspection: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-inspection-service
        awslogs-stream: app-${INSPECTION_IMAGE_TAG:?set INSPECTION_IMAGE_TAG to inspection-service's Git commit SHA}
        awslogs-create-group: "true"

  # --- media-service ---

  media-service:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-media-service:${MEDIA_IMAGE_TAG:?set MEDIA_IMAGE_TAG to media-service's Git commit SHA}
    restart: unless-stopped
    mem_limit: 48m
    mem_reservation: 16m
    # STORAGE_BUCKET comes from media.env - media-service owns its own
    # storage configuration (see this file's header comment and
    # deploy/env-templates/media.env.example), never duplicated here.
    env_file:
      - ${BEEBASE_CONFIG_DIR:-../config}/media.env
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      GOMEMLIMIT: 40MiB
      DATABASE_URL: postgres://beebase:${POSTGRES_MEDIA_PASSWORD:?set POSTGRES_MEDIA_PASSWORD}@postgres-media:5432/beebase_media?sslmode=disable
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      REDIS_ADDR: redis:6379
      PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      # Media blobs live in Amazon S3. No static access key here,
      # deliberately: the container authenticates to S3 via the EC2
      # instance's IAM role (see terraform/modules/iam), resolved
      # automatically by the AWS SDK's default credential chain - no
      # static key ever exists on this host or in this image.
      STORAGE_REGION: ${AWS_REGION:?set AWS_REGION}
    networks: [beebase]
    depends_on:
      postgres-media: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate-media: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-media-service
        awslogs-stream: app-${MEDIA_IMAGE_TAG:?set MEDIA_IMAGE_TAG to media-service's Git commit SHA}
        awslogs-create-group: "true"

  # --- statistics-service (stateless, no database of its own) ---

  statistics-service:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-statistics-service:${STATISTICS_IMAGE_TAG:?set STATISTICS_IMAGE_TAG to statistics-service's Git commit SHA}
    restart: unless-stopped
    mem_limit: 48m
    mem_reservation: 16m
    env_file:
      - ${BEEBASE_CONFIG_DIR:-../config}/statistics.env
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      GOMEMLIMIT: 40MiB
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      REDIS_ADDR: redis:6379
      APIARY_SERVICE_URL: http://apiary-service:8080
      HIVE_SERVICE_URL: http://hive-service:8080
      INSPECTION_SERVICE_URL: http://inspection-service:8080
    networks: [beebase]
    depends_on:
      auth-service: { condition: service_healthy }
      apiary-service: { condition: service_healthy }
      hive-service: { condition: service_healthy }
      inspection-service: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-statistics-service
        awslogs-stream: app-${STATISTICS_IMAGE_TAG:?set STATISTICS_IMAGE_TAG to statistics-service's Git commit SHA}
        awslogs-create-group: "true"

  # --- subscription-service ---

  subscription-service:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-subscription-service:${SUBSCRIPTION_IMAGE_TAG:?set SUBSCRIPTION_IMAGE_TAG to subscription-service's Git commit SHA}
    restart: unless-stopped
    mem_limit: 48m
    mem_reservation: 16m
    # LOG_LEVEL can be configured via subscription.env; leaving it unset
    # falls through to the app's own default ("info" - see internal/config/config.go).
    env_file:
      - ${BEEBASE_CONFIG_DIR:-../config}/subscription.env
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      GOMEMLIMIT: 40MiB
      DATABASE_URL: postgres://beebase:${POSTGRES_SUBSCRIPTION_PASSWORD:?set POSTGRES_SUBSCRIPTION_PASSWORD}@postgres-subscription:5432/beebase_subscription?sslmode=disable
    networks: [beebase]
    depends_on:
      postgres-subscription: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-subscription-service
        awslogs-stream: app-${SUBSCRIPTION_IMAGE_TAG:?set SUBSCRIPTION_IMAGE_TAG to subscription-service's Git commit SHA}
        awslogs-create-group: "true"

  # --- PostgreSQL, one container per bounded context, each on its own
  #     bind-mounted directory on the dedicated EBS data volume. No host
  #     port is published for any of them - only reachable from other
  #     containers on the `beebase` network. ---

  postgres-auth:
    image: postgres:16-alpine
    restart: unless-stopped
    command: *pg-tuning-flags
    mem_limit: 64m
    mem_reservation: 32m
    environment:
      POSTGRES_USER: beebase
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:?set POSTGRES_AUTH_PASSWORD}
      POSTGRES_DB: beebase_auth
    volumes:
      - /mnt/beebase-data/postgres/auth:/var/lib/postgresql/data
    networks: [beebase]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/infra
        awslogs-stream: postgres-auth-${RELEASE:?set RELEASE to the release manifest identifier}
        awslogs-create-group: "true"

  postgres-apiary:
    image: postgres:16-alpine
    restart: unless-stopped
    command: *pg-tuning-flags
    mem_limit: 64m
    mem_reservation: 32m
    environment:
      POSTGRES_USER: beebase
      POSTGRES_PASSWORD: ${POSTGRES_APIARY_PASSWORD:?set POSTGRES_APIARY_PASSWORD}
      POSTGRES_DB: beebase_apiary
    volumes:
      - /mnt/beebase-data/postgres/apiary:/var/lib/postgresql/data
    networks: [beebase]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_apiary"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/infra
        awslogs-stream: postgres-apiary-${RELEASE:?set RELEASE to the release manifest identifier}
        awslogs-create-group: "true"

  postgres-hive:
    image: postgres:16-alpine
    restart: unless-stopped
    command: *pg-tuning-flags
    mem_limit: 64m
    mem_reservation: 32m
    environment:
      POSTGRES_USER: beebase
      POSTGRES_PASSWORD: ${POSTGRES_HIVE_PASSWORD:?set POSTGRES_HIVE_PASSWORD}
      POSTGRES_DB: beebase_hive
    volumes:
      - /mnt/beebase-data/postgres/hive:/var/lib/postgresql/data
    networks: [beebase]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_hive"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/infra
        awslogs-stream: postgres-hive-${RELEASE:?set RELEASE to the release manifest identifier}
        awslogs-create-group: "true"

  postgres-inspection:
    image: postgres:16-alpine
    restart: unless-stopped
    command: *pg-tuning-flags
    mem_limit: 64m
    mem_reservation: 32m
    environment:
      POSTGRES_USER: beebase
      POSTGRES_PASSWORD: ${POSTGRES_INSPECTION_PASSWORD:?set POSTGRES_INSPECTION_PASSWORD}
      POSTGRES_DB: beebase_inspection
    volumes:
      - /mnt/beebase-data/postgres/inspection:/var/lib/postgresql/data
    networks: [beebase]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_inspection"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/infra
        awslogs-stream: postgres-inspection-${RELEASE:?set RELEASE to the release manifest identifier}
        awslogs-create-group: "true"

  postgres-media:
    image: postgres:16-alpine
    restart: unless-stopped
    command: *pg-tuning-flags
    mem_limit: 64m
    mem_reservation: 32m
    environment:
      POSTGRES_USER: beebase
      POSTGRES_PASSWORD: ${POSTGRES_MEDIA_PASSWORD:?set POSTGRES_MEDIA_PASSWORD}
      POSTGRES_DB: beebase_media
    volumes:
      - /mnt/beebase-data/postgres/media:/var/lib/postgresql/data
    networks: [beebase]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_media"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/infra
        awslogs-stream: postgres-media-${RELEASE:?set RELEASE to the release manifest identifier}
        awslogs-create-group: "true"

  postgres-subscription:
    image: postgres:16-alpine
    restart: unless-stopped
    command: *pg-tuning-flags
    mem_limit: 64m
    mem_reservation: 32m
    environment:
      POSTGRES_USER: beebase
      POSTGRES_PASSWORD: ${POSTGRES_SUBSCRIPTION_PASSWORD:?set POSTGRES_SUBSCRIPTION_PASSWORD}
      POSTGRES_DB: beebase_subscription
    volumes:
      - /mnt/beebase-data/postgres/subscription:/var/lib/postgresql/data
    networks: [beebase]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beebase -d beebase_subscription"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/infra
        awslogs-stream: postgres-subscription-${RELEASE:?set RELEASE to the release manifest identifier}
        awslogs-create-group: "true"

  # --- Redis: shared single-active-session store ---
  #
  # No host port published, no AUTH (the app doesn't support it yet -
  # see the deployment report's risk list) - network isolation on the
  # internal-only `beebase` network is the control here. AOF persistence
  # is disabled (t4g.micro sizing: AOF's continuous rewrite/fsync
  # overhead isn't worth it here) - not required for correctness either
  # way, since a lost session marker just costs the affected user one
  # extra refresh round-trip (see beebase-auth-service's issueSession,
  # which re-Activates on every login/refresh/setup). The image's default
  # periodic RDB snapshotting (to the `redis-data` volume) is left as-is:
  # near-zero cost given how tiny this dataset is, and it's a free bit of
  # extra durability on top of the documented in-app fallback.
  # maxmemory bounds the dataset itself (one small key per active user,
  # TTL-bound) well under the container's own mem_limit below, which
  # covers Redis's own process/connection overhead on top of that.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 48m
    mem_reservation: 16m
    volumes:
      - redis-data:/data
    networks: [beebase]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/infra
        awslogs-stream: redis-${RELEASE:?set RELEASE to the release manifest identifier}
        awslogs-create-group: "true"

  # --- Migrations: one-shot per database, gated before its app service
  #     starts. Images are pre-built with the SQL files baked in (see
  #     each service's Dockerfile.migrate) and tagged <sha>-migrate
  #     alongside the app image - the host never checks out source. ---

  migrate-auth:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-auth-service:${AUTH_IMAGE_TAG:?set AUTH_IMAGE_TAG to auth-service's Git commit SHA}-migrate
    restart: "no"
    mem_limit: 64m
    command:
      - -path=/migrations
      - -database=postgres://beebase:${POSTGRES_AUTH_PASSWORD:?set POSTGRES_AUTH_PASSWORD}@postgres-auth:5432/beebase_auth?sslmode=disable
      - up
    networks: [beebase]
    depends_on:
      postgres-auth: { condition: service_healthy }
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-auth-service
        awslogs-stream: migrate-${AUTH_IMAGE_TAG:?set AUTH_IMAGE_TAG to auth-service's Git commit SHA}
        awslogs-create-group: "true"

  migrate-apiary:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-apiary-service:${APIARY_IMAGE_TAG:?set APIARY_IMAGE_TAG to apiary-service's Git commit SHA}-migrate
    restart: "no"
    mem_limit: 64m
    command:
      - -path=/migrations
      - -database=postgres://beebase:${POSTGRES_APIARY_PASSWORD:?set POSTGRES_APIARY_PASSWORD}@postgres-apiary:5432/beebase_apiary?sslmode=disable
      - up
    networks: [beebase]
    depends_on:
      postgres-apiary: { condition: service_healthy }
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-apiary-service
        awslogs-stream: migrate-${APIARY_IMAGE_TAG:?set APIARY_IMAGE_TAG to apiary-service's Git commit SHA}
        awslogs-create-group: "true"

  migrate-hive:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-hive-service:${HIVE_IMAGE_TAG:?set HIVE_IMAGE_TAG to hive-service's Git commit SHA}-migrate
    restart: "no"
    mem_limit: 64m
    command:
      - -path=/migrations
      - -database=postgres://beebase:${POSTGRES_HIVE_PASSWORD:?set POSTGRES_HIVE_PASSWORD}@postgres-hive:5432/beebase_hive?sslmode=disable
      - up
    networks: [beebase]
    depends_on:
      postgres-hive: { condition: service_healthy }
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-hive-service
        awslogs-stream: migrate-${HIVE_IMAGE_TAG:?set HIVE_IMAGE_TAG to hive-service's Git commit SHA}
        awslogs-create-group: "true"

  migrate-inspection:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-inspection-service:${INSPECTION_IMAGE_TAG:?set INSPECTION_IMAGE_TAG to inspection-service's Git commit SHA}-migrate
    restart: "no"
    mem_limit: 64m
    command:
      - -path=/migrations
      - -database=postgres://beebase:${POSTGRES_INSPECTION_PASSWORD:?set POSTGRES_INSPECTION_PASSWORD}@postgres-inspection:5432/beebase_inspection?sslmode=disable
      - up
    networks: [beebase]
    depends_on:
      postgres-inspection: { condition: service_healthy }
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-inspection-service
        awslogs-stream: migrate-${INSPECTION_IMAGE_TAG:?set INSPECTION_IMAGE_TAG to inspection-service's Git commit SHA}
        awslogs-create-group: "true"

  migrate-media:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-media-service:${MEDIA_IMAGE_TAG:?set MEDIA_IMAGE_TAG to media-service's Git commit SHA}-migrate
    restart: "no"
    mem_limit: 64m
    command:
      - -path=/migrations
      - -database=postgres://beebase:${POSTGRES_MEDIA_PASSWORD:?set POSTGRES_MEDIA_PASSWORD}@postgres-media:5432/beebase_media?sslmode=disable
      - up
    networks: [beebase]
    depends_on:
      postgres-media: { condition: service_healthy }
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?set AWS_REGION}
        awslogs-group: /beebase/prod/beebase-media-service
        awslogs-stream: migrate-${MEDIA_IMAGE_TAG:?set MEDIA_IMAGE_TAG to media-service's Git commit SHA}
        awslogs-create-group: "true"

  migrate-subscription:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY}/beebase-subscription-service:${SUBSCRIPTION_IMAGE_TAG:?set SUBSCRIPTION_IMAGE_TAG to subscription-service's Git commit SHA}-migrate
    restart: "no"
    mem_limit: 64m
    command:
      - -path=/migrations
      - -database=postgres://beebase:${POSTGRES_SUBSCRIPTION_PASSWORD:?set POSTGRES_SUBSCRIPTION_PASSWORD}@postgres-subscription:5432/beebase_subscription?sslmode=disable
      - up
    networks: [beebase]
    depends_on:
