  media-service:
    build:
      context: ../beebase-media-service
      secrets:
        - github_token
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-beebase}:${POSTGRES_MEDIA_PASSWORD:?set POSTGRES_MEDIA_PASSWORD}@media-postgres:5432/${MEDIA_DB_NAME:-beebase_media_dev}?sslmode=disable
      REDIS_ADDR: redis:6379
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:18080}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-beebase-media-dev}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_FORCE_PATH_STYLE: "true"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      media-postgres:
        condition: service_healthy
      media-migrate:
        condition: service_completed_successfully
      auth-service:
