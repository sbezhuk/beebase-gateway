    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beebase}
      POSTGRES_PASSWORD: ${POSTGRES_HARVEST_PASSWORD:?set POSTGRES_HARVEST_PASSWORD}
      POSTGRES_DB: ${HARVEST_DB_NAME:-beebase_harvest_dev}
    ports:
      - "${HARVEST_POSTGRES_PORT:-15438}:5432"
    volumes:
      - beebase_dev_harvest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beebase} -d ${HARVEST_DB_NAME:-beebase_harvest_dev}"]
      interval: 5s
