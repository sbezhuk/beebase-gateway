  subscription-service:
    build:
      context: ../beebase-subscription-service
      secrets:
        - github_token
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-beebase}:${POSTGRES_SUBSCRIPTION_PASSWORD:?set POSTGRES_SUBSCRIPTION_PASSWORD}@subscription-postgres:5432/${SUBSCRIPTION_DB_NAME:-beebase_subscription_dev}?sslmode=disable
      REDIS_ADDR: redis:6379
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.beebase.production}
      APPLE_ENVIRONMENT: ${APPLE_ENVIRONMENT:-Sandbox}
      GOOGLE_PACKAGE_NAME: ${GOOGLE_PACKAGE_NAME:-com.beebase.production}
    depends_on:
      subscription-postgres:
