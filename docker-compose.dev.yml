  harvest-service:
    build:
      context: ../beebase-harvest-service
      secrets:
        - github_token
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-beebase}:${POSTGRES_HARVEST_PASSWORD:?set POSTGRES_HARVEST_PASSWORD}@harvest-postgres:5432/${HARVEST_DB_NAME:-beebase_harvest_dev}?sslmode=disable
      REDIS_ADDR: redis:6379
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      # Harvest has no ownership data of its own: every operation
      # confirms the caller owns the specified hive by calling
      # hive-service directly, on every request.
      HIVE_SERVICE_URL: http://hive-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    depends_on:
      harvest-postgres:
        condition: service_healthy
      harvest-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      hive-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

