  notification-migrate:
    image: migrate/migrate:v4.19.0
    depends_on:
      notification-postgres: {condition: service_healthy}
    volumes:
      - ../beebase-notification-service/migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - 'migrate -path=/migrations -database "postgres://${POSTGRES_USER:-beebase}:${POSTGRES_NOTIFICATION_PASSWORD:?set POSTGRES_NOTIFICATION_PASSWORD}@notification-postgres:5432/${NOTIFICATION_DB_NAME:-beebase_notification_dev}?sslmode=disable" up'

  notification-service:
    build:
      context: ../beebase-notification-service
      secrets:
        - github_token
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-beebase}:${POSTGRES_NOTIFICATION_PASSWORD:?set POSTGRES_NOTIFICATION_PASSWORD}@notification-postgres:5432/${NOTIFICATION_DB_NAME:-beebase_notification_dev}?sslmode=disable
      REDIS_ADDR: redis:6379
      AUTH_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.beebase.production}
      APPLE_KEY_ID: ${APPLE_KEY_ID}
      APPLE_ISSUER_ID: ${APPLE_ISSUER_ID}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY}
      APPLE_ENVIRONMENT: ${APPLE_ENVIRONMENT:-Sandbox}
    depends_on:
      notification-postgres: {condition: service_healthy}
      notification-migrate: {condition: service_completed_successfully}
      auth-service: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Gateway ---
  gateway:
    build:
      context: .
      secrets:
        - github_token
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      HTTP_PORT: "8080"
      AUTH_SERVICE_URL: http://auth-service:8080
      APIARY_SERVICE_URL: http://apiary-service:8080
      HIVE_SERVICE_URL: http://hive-service:8080
      INSPECTION_SERVICE_URL: http://inspection-service:8080
      HARVEST_SERVICE_URL: http://harvest-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      STATISTICS_SERVICE_URL: http://statistics-service:8080
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    ports:
      - "${GATEWAY_PORT:-18080}:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      apiary-service:
        condition: service_healthy
      hive-service:
        condition: service_healthy
      inspection-service:
        condition: service_healthy
      harvest-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      statistics-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  beebase_dev_auth_postgres_data:
  beebase_dev_apiary_postgres_data:
  beebase_dev_hive_postgres_data:
  beebase_dev_inspection_postgres_data:
  beebase_dev_harvest_postgres_data:
  beebase_dev_media_postgres_data:
  beebase_dev_subscription_postgres_data:
  beebase_dev_notification_postgres_data:
  beebase_dev_minio_data:

secrets:
  # A read-scoped GitHub PAT (or fine-grained token with contents:read
  # on beebase-common) for fetching that private module at build time -
  # see hive/inspection/statistics-service's own Dockerfile for why.
  # Set BEEBASE_COMMON_GH_TOKEN in your shell/`.env` before `docker
  # compose build`; never committed, never baked into an image layer.
  github_token:
    environment: BEEBASE_COMMON_GH_TOKEN
