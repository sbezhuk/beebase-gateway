# Production release pipeline for BeeBase.
#
# Unlike each service's own pipeline (Test -> Build -> push, see
# beebase-common/ci/azure-pipelines-service-template.yml), this pipeline
# never builds or tests anything. Its only job is to combine the 7
# independently-versioned services into one deployable unit:
#
#   1. Resolve the exact Git-SHA image tag each of the 7 service
#      pipelines most recently built and pushed to ECR - independently,
#      never assuming they match (resources.pipeline.<alias>.sourceCommit
#      below, one per service).
#   2. Write those 7 tags into one immutable release manifest
#      (RELEASE=<date>-<BuildId>), see deploy/lib/manifest.sh for its
#      format and validation rules.
#   3. Ship the manifest to the EC2 host and run deploy.sh against it,
#      exactly once, via the same "aws ssm send-command + poll" pattern
#      each service pipeline used to run against a single tag - see the
#      old Deploy stage this replaced in beebase-common's template.
#
# deploy.sh itself does the rest: verifies every image actually exists
# in ECR, pulls, runs migrations, recreates the stack, waits for health
# checks, and runs the gateway smoke tests - failing the whole release
# before touching any running container if any of that doesn't pass.
#
# This pipeline is registered separately in Azure DevOps from
# beebase-gateway's own azure-pipelines.yml (which still only does
# Test -> Build -> push for the gateway image itself) - see
# beebase-gateway/README.md's "Azure DevOps configuration required"
# section for the one-time setup, including granting this pipeline
# permission to consume the other 6 pipeline resources below.

resources:
  pipelines:
    - pipeline: gateway
      source: beebase-gateway # Azure DevOps pipeline name (Test->Build only), not the repo name
      trigger: none
    - pipeline: auth
      source: beebase-auth-service
      trigger: none
    - pipeline: apiary
      source: beebase-apiary-service
      trigger: none
    - pipeline: hive
      source: beebase-hive-service
      trigger: none
    - pipeline: inspection
      source: beebase-inspection-service
      trigger: none
    - pipeline: media
      source: beebase-media-service
      trigger: none
    - pipeline: statistics
      source: beebase-statistics-service
      trigger: none

# Run on demand ("Run pipeline" in Azure DevOps) once every service you
# want in the release has a green Build on main - never automatically on
# a single service's push, which is exactly the "one SHA drives every
# service" assumption this whole redesign removes.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: beebase-prod-pipeline # AWS_REGION, AWS_ACCOUNT_ID, EC2_INSTANCE_ID

stages:
  - stage: ResolveAndDeploy
    jobs:
      - deployment: ReleaseToProduction
        environment: "beebase-production" # gives this stage a manual-approval gate in Azure DevOps Environments
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AWSShellScript@1
                  inputs:
                    awsCredentials: "AWS-BeeBase-OIDC"
                    regionName: "$(AWS_REGION)"
                    scriptType: "inline"
                    inlineScript: |
                      set -euo pipefail

                      RELEASE="$(date -u +%Y.%m.%d)-$(Build.BuildId)"
                      MANIFEST_FILE="/opt/beebase/releases/${RELEASE}.env"

                      # Each resources.pipeline.<alias>.sourceCommit is the full
                      # 40-char SHA of that pipeline's own latest successful run -
                      # resolved independently per service, never assumed equal.
                      cat >release-manifest.env <<EOF
                      RELEASE=${RELEASE}
                      CREATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                      GATEWAY_IMAGE_TAG=$(resources.pipeline.gateway.sourceCommit)
                      AUTH_IMAGE_TAG=$(resources.pipeline.auth.sourceCommit)
                      APIARY_IMAGE_TAG=$(resources.pipeline.apiary.sourceCommit)
                      HIVE_IMAGE_TAG=$(resources.pipeline.hive.sourceCommit)
                      INSPECTION_IMAGE_TAG=$(resources.pipeline.inspection.sourceCommit)
                      MEDIA_IMAGE_TAG=$(resources.pipeline.media.sourceCommit)
                      STATISTICS_IMAGE_TAG=$(resources.pipeline.statistics.sourceCommit)
                      EOF

                      echo "--- resolved release manifest ---"
                      cat release-manifest.env

                      # Ship the manifest to the host and run deploy.sh against it in
                      # the same SSM command - deploy.sh itself validates every tag,
                      # checks each image actually exists in ECR, and fails fast
                      # before touching any running container. Manifests are
                      # immutable: refuse if this release id somehow already exists
                      # rather than overwriting it.
                      MANIFEST_B64=$(base64 -w0 release-manifest.env)

                      COMMAND_ID=$(aws ssm send-command \
                        --instance-ids "$(EC2_INSTANCE_ID)" \
                        --document-name "AWS-RunShellScript" \
                        --comment "Release ${RELEASE}" \
                        --parameters commands="[
                          \"set -euo pipefail\",
                          \"mkdir -p /opt/beebase/releases\",
                          \"if [ -e '${MANIFEST_FILE}' ]; then echo 'release manifest ${MANIFEST_FILE} already exists - releases are immutable' >&2; exit 1; fi\",
                          \"umask 022\",
                          \"echo '${MANIFEST_B64}' | base64 -d > '${MANIFEST_FILE}'\",
                          \"/opt/beebase/deploy/deploy.sh '${MANIFEST_FILE}'\"
                        ]" \
                        --query "Command.CommandId" --output text)

                      echo "SSM command: ${COMMAND_ID}"

                      # Poll until the command finishes - deploy.sh itself runs the
                      # full stack + migrations + health checks + smoke tests, so
                      # this is the single gate the whole release hangs on. A wider
                      # timeout than a single-service deploy used: this SSM command
                      # migrates + starts all 7 services, not just one.
                      for i in $(seq 1 90); do
                        STATUS=$(aws ssm get-command-invocation \
                          --command-id "${COMMAND_ID}" \
                          --instance-id "$(EC2_INSTANCE_ID)" \
                          --query "Status" --output text 2>/dev/null || echo "Pending")
                        case "${STATUS}" in
                          Success) break ;;
                          Failed|Cancelled|TimedOut)
                            echo "Release failed with status: ${STATUS}" >&2
                            aws ssm get-command-invocation \
                              --command-id "${COMMAND_ID}" \
                              --instance-id "$(EC2_INSTANCE_ID)" \
                              --query "StandardErrorContent" --output text >&2
                            exit 1
                            ;;
                          *) sleep 10 ;;
                        esac
                      done

                      if [ "${STATUS}" != "Success" ]; then
                        echo "Release did not finish within the timeout" >&2
                        exit 1
                      fi

                      echo "--- deploy.sh output ---"
                      aws ssm get-command-invocation \
                        --command-id "${COMMAND_ID}" \
                        --instance-id "$(EC2_INSTANCE_ID)" \
                        --query "StandardOutputContent" --output text
                  displayName: "Resolve release manifest and deploy via SSM"
